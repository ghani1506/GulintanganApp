plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ghani.gulintangan'
    compileSdk 34

    defaultConfig {
        applicationId "com.ghani.gulintangan"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
